[package]
name = "inference-lite"
version = "0.1.0"
edition = "2024"
description = "From-scratch GGUF inference + serving engine on candle's quantized kernels"

# Library: forward pass, GGUF parser, and the load-once runtime.
# Binaries (auto-discovered from src/bin): `inference` (CLI) and `server` (HTTP).
[lib]
name = "inference_lite"
path = "src/lib.rs"

[dependencies]
candle-core = "0.10.2"
# f16 KV cache: K/V are stored half-precision to halve attention read bandwidth
# and cache RAM. Same `half::f16` candle uses, so the types interoperate.
half = "2"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
anyhow = "1.0.102"
axum = "0.7"
tokio = { version = "1.35", features = ["full"] }
# Adapts the mpsc receiver the streaming endpoint writes tokens into
# (`engine.generate`'s on_token callback) into an axum response body stream.
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Data-parallel attention: candle already pulls rayon in transitively for its
# matmuls; we depend on it directly to parallelize the fused SDPA kernel over
# query heads.
rayon = "1.12"
